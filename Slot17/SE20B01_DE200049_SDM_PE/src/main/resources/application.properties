spring.application.name=SDM_PE

server.port=8080
server.servlet.context-path=/

# SQL Server Connection
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=HSF302_2026_PE_SDM;encrypt=false;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123456
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate Configuration (ddl-auto=none b?t bu?c ?? không t? s?a DB)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.open-in-view=true

# Thymeleaf Cache Disable (d? debug)
spring.thymeleaf.cache=false