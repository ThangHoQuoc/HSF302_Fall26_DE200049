<!DOCTYPE html>
<html lang="vi" th:lang="${#locale.language}"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <!-- TODO 15.1 -->
    <title th:text="${student.id == null} ? #{form.create.title} : #{form.edit.title}">Form sinh viên</title>
</head>
<body>
<section layout:fragment="content">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-header">
                    <!-- TODO 15.2 -->
                    <h4 class="mb-0"
                        th:text="${student.id == null} ? #{form.create.heading}
                                 : #{form.edit.heading(${student.studentCode})}">
                        Thêm sinh viên mới
                    </h4>
                </div>
                <div class="card-body">
                    <!-- TODO 15.3 -->
                    <form th:action="@{/students/save}" th:object="${student}" method="post" novalidate>
                        <!-- TODO 15.4 -->
                        <input type="hidden" th:field="*{id}">

                        <!-- TODO 16.1 -->
                        <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger" role="alert">
                            <strong th:text="#{form.errors}">Vui lòng sửa các lỗi sau:</strong>
                            <ul class="mb-0">
                                <li th:each="err : ${#fields.errors('*')}" th:text="${err}">Lỗi</li>
                            </ul>
                        </div>

                        <div class="row g-3">
                            <!-- TODO 15.5 + 16.2 -->
                            <div class="col-md-6">
                                <label for="studentCode" class="form-label"><span th:text="#{student.code}">Mã sinh viên</span> <span class="text-danger">*</span></label>
                                <input type="text" id="studentCode" class="form-control" placeholder="VD: SE180001" th:placeholder="#{form.code.placeholder}"
                                       th:field="*{studentCode}" th:errorclass="is-invalid">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('studentCode')}"
                                     th:errors="*{studentCode}"></div>
                            </div>
                            <div class="col-md-6">
                                <label for="fullName" class="form-label"><span th:text="#{student.name}">Họ tên</span> <span class="text-danger">*</span></label>
                                <input type="text" id="fullName" class="form-control"
                                       th:field="*{fullName}" th:errorclass="is-invalid">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('fullName')}"
                                     th:errors="*{fullName}"></div>
                            </div>
                            <div class="col-md-6">
                                <label for="email" class="form-label"><span th:text="#{student.email}">Email</span> <span class="text-danger">*</span></label>
                                <input type="email" id="email" class="form-control"
                                       th:field="*{email}" th:errorclass="is-invalid">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}"
                                     th:errors="*{email}"></div>
                            </div>
                            <div class="col-md-6">
                                <label for="dateOfBirth" class="form-label"><span th:text="#{student.birthDate}">Ngày sinh</span> <span class="text-danger">*</span></label>
                                <input type="date" id="dateOfBirth" class="form-control"
                                       th:field="*{dateOfBirth}" th:errorclass="is-invalid">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('dateOfBirth')}"
                                     th:errors="*{dateOfBirth}"></div>
                            </div>
                            <div class="col-md-6">
                                <label for="gpa" class="form-label"><span th:text="#{student.gpa.range}">GPA (0 - 10)</span> <span class="text-danger">*</span></label>
                                <!-- Dùng text để có thể nhập chữ và kiểm tra lỗi chuyển kiểu ở server -->
                                <input type="text" id="gpa" class="form-control" placeholder="VD: 8.5" th:placeholder="#{form.gpa.placeholder}"
                                       th:field="*{gpa}" th:errorclass="is-invalid">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('gpa')}"
                                     th:errors="*{gpa}"></div>
                            </div>
                            <div class="col-md-6">
                                <label for="major" class="form-label"><span th:text="#{student.major}">Ngành</span> <span class="text-danger">*</span></label>
                                <!-- TODO 15.6 -->
                                <select id="major" class="form-select" th:field="*{major}" th:errorclass="is-invalid">
                                    <option value="" th:text="#{major.choose}">-- Chọn ngành --</option>
                                    <option th:each="m : ${majors}"
                                            th:value="${m.key}"
                                            th:text="|${m.key} - ${m.value}|">SE - Kỹ thuật phần mềm</option>
                                </select>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('major')}"
                                     th:errors="*{major}"></div>
                            </div>
                            <div class="col-12">
                                <!-- TODO 15.7 -->
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" th:field="*{active}">
                                    <label class="form-check-label" th:for="${#ids.prev('active')}" th:text="#{status.active}">Đang học</label>
                                </div>
                            </div>
                        </div>

                        <div class="mt-4 d-flex gap-2">
                            <!-- TODO 15.8 -->
                            <button type="submit" class="btn btn-primary"
                                    th:text="*{id == null} ? #{action.create} : #{action.save}">Lưu</button>
                            <a th:href="@{/students}" class="btn btn-secondary" th:text="#{action.cancel}">Hủy</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
