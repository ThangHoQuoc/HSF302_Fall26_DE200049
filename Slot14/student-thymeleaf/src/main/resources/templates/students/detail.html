<!DOCTYPE html>
<html lang="vi" th:lang="${#locale.language}"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title th:text="#{detail.title}">Chi tiết sinh viên</title>
</head>
<body>
<section layout:fragment="content">
    <div class="card shadow-sm">
        <div class="card-header d-flex justify-content-between align-items-center">
            <!-- TODO 14.1 -->
            <h4 class="mb-0" th:text="|${student.studentCode} - ${student.fullName}|">SE180001 - Nguyễn Văn A</h4>
            <!-- TODO 14.2 -->
            <span class="badge"
                  th:classappend="${student.active} ? 'text-bg-success' : 'text-bg-secondary'"
                  th:text="${student.active} ? #{status.active} : #{status.inactive}">Đang học</span>
        </div>
        <div class="card-body">
            <!-- TODO 14.3 -->
            <dl class="row mb-0">
                <dt class="col-sm-3" th:text="#{student.code}">Mã sinh viên</dt>
                <dd class="col-sm-9" th:text="${student.studentCode}">SE180001</dd>

                <dt class="col-sm-3" th:text="#{student.name}">Họ tên</dt>
                <dd class="col-sm-9" th:text="${student.fullName}">Nguyễn Văn A</dd>

                <dt class="col-sm-3" th:text="#{student.email}">Email</dt>
                <dd class="col-sm-9">
                    <a th:href="|mailto:${student.email}|"
                       th:text="${student.email} ?: #{detail.notUpdated}">a@fpt.edu.vn</a>
                </dd>

                <dt class="col-sm-3" th:text="#{student.birthDate}">Ngày sinh</dt>
                <dd class="col-sm-9"
                    th:text="#{detail.birthAndAge(${#temporals.format(student.dateOfBirth, 'dd/MM/yyyy')},${student.age})}">
                    01/01/2004 (22 tuổi)
                </dd>

                <dt class="col-sm-3" th:text="#{student.major}">Ngành</dt>
                <dd class="col-sm-9"
                    th:text="${student.major} + ' - ' + (${majors[student.major]} ?: #{detail.unknownMajor})">
                    SE - Kỹ thuật phần mềm
                </dd>

                <dt class="col-sm-3" th:text="#{student.gpa}">GPA</dt>
                <dd class="col-sm-9" th:text="${#numbers.formatDecimal(student.gpa, 1, 2)} + ' / 10'">8.00 / 10</dd>

                <dt class="col-sm-3" th:text="#{student.rank}">Xếp loại</dt>
                <dd class="col-sm-9">
                    <span th:replace="~{fragments/badges :: rank(${student.rank})}">Giỏi</span>
                </dd>

                <dt class="col-sm-3" th:text="#{student.scholarship}">Học bổng</dt>
                <dd class="col-sm-9"
                    th:text="${student.gpa ge 8.0 and student.active}
                             ? #{detail.scholarship.eligible} : #{detail.scholarship.ineligible}">
                    Đủ điều kiện xét học bổng
                </dd>
            </dl>

            <!-- TODO 14.4 (bonus): So sánh selection expression với variable expression -->
            <hr>
            <div th:object="${student}" class="small text-muted">
                <span th:text="#{detail.selection}">Selection expression → </span>
                <span th:text="*{fullName}">Nguyễn Văn A</span> –
                <span th:text="*{email}">a@fpt.edu.vn</span>
            </div>
        </div>
        <div class="card-footer">
            <!-- TODO 14.5 -->
            <a th:href="@{/students}" class="btn btn-secondary" th:text="#{action.back}">← Quay lại</a>
            <a th:href="@{/students/{id}/edit(id=${student.id})}" class="btn btn-warning" th:text="#{action.edit}">Sửa</a>
        </div>
    </div>
</section>
</body>
</html>
