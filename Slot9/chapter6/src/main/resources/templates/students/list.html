<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Danh sách sinh viên</title>
</head>
<body>
<section>
    <!-- Tiêu đề & Nút thêm -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-people-fill me-2"></i>Danh sách sinh viên</h2>
        <a th:href="@{/students/create}" class="btn btn-primary">
            <i class="bi bi-plus-lg me-1"></i>Thêm sinh viên
        </a>
    </div>

    <!-- Form tìm kiếm -->
    <form th:action="@{/students}" method="get" class="mb-4">
        <div class="input-group">
            <input type="text" name="keyword" class="form-control"
                   placeholder="Nhập tên hoặc email cần tìm..."
                   th:value="${keyword}"/>
            <button class="btn btn-outline-primary" type="submit">
                <i class="bi bi-search me-1"></i>Tìm kiếm
            </button>
            <a th:if="${keyword != null and !keyword.isBlank()}"
               th:href="@{/students}" class="btn btn-outline-secondary">
                <i class="bi bi-x-lg me-1"></i>Xóa lọc
            </a>
        </div>
    </form>

    <div class="card shadow-sm">
        <div class="card-body p-0">

            <!-- Trường hợp danh sách rỗng -->
            <div th:if="${studentPage.totalElements == 0}" class="text-center p-5 text-muted">
                <i class="bi bi-inbox display-4"></i>
                <p class="mt-2">Không tìm thấy sinh viên nào.</p>
                <a th:href="@{/students/create}" class="btn btn-outline-primary">Thêm ngay</a>
            </div>

            <!-- Bảng dữ liệu -->
            <table th:unless="${studentPage.totalElements == 0}" class="table table-hover mb-0">
                <thead>
                <tr>
                    <th>#</th>

                    <!-- Cột ID -->
                    <th>
                        <a class="text-dark text-decoration-none"
                           th:href="@{/students(page=${currentPage}, keyword=${keyword}, sortBy='id', sortDir=${sortBy == 'id' ? reverseSortDir : 'asc'})}">
                            ID
                            <i th:if="${sortBy == 'id'}"
                               th:class="${sortDir == 'asc' ? 'bi bi-arrow-up' : 'bi bi-arrow-down'}"></i>
                        </a>
                    </th>

                    <!-- Cột Họ tên -->
                    <th>
                        <a class="text-dark text-decoration-none"
                           th:href="@{/students(page=${currentPage}, keyword=${keyword}, sortBy='name', sortDir=${sortBy == 'name' ? reverseSortDir : 'asc'})}">
                            Họ tên
                            <i th:if="${sortBy == 'name'}"
                               th:class="${sortDir == 'asc' ? 'bi bi-arrow-up' : 'bi bi-arrow-down'}"></i>
                        </a>
                    </th>

                    <!-- Cột Email -->
                    <th>
                        <a class="text-dark text-decoration-none"
                           th:href="@{/students(page=${currentPage}, keyword=${keyword}, sortBy='email', sortDir=${sortDir == 'asc' and sortBy == 'email' ? 'desc' : 'asc'})}">
                            Email
                            <i th:if="${sortBy == 'email'}"
                               th:class="${sortDir == 'asc' ? 'bi bi-arrow-up' : 'bi bi-arrow-down'}"></i>
                        </a>
                    </th>

                    <!-- Cột Tuổi -->
                    <th>
                        <a class="text-dark text-decoration-none"
                           th:href="@{/students(page=${currentPage}, keyword=${keyword}, sortBy='age', sortDir=${sortBy == 'age' ? reverseSortDir : 'asc'})}">
                            Tuổi
                            <i th:if="${sortBy == 'age'}"
                               th:class="${sortDir == 'asc' ? 'bi bi-arrow-up' : 'bi bi-arrow-down'}"></i>
                        </a>
                    </th>

                    <th>Chuyên ngành</th>

                    <!-- Cột GPA -->
                    <th>
                        <a class="text-dark text-decoration-none"
                           th:href="@{/students(page=${currentPage}, keyword=${keyword}, sortBy='gpa', sortDir=${sortBy == 'gpa' ? reverseSortDir : 'asc'})}">
                            GPA
                            <i th:if="${sortBy == 'gpa'}"
                               th:class="${sortDir == 'asc' ? 'bi bi-arrow-up' : 'bi bi-arrow-down'}"></i>
                        </a>
                    </th>

                    <th class="text-center">Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="student, stat : ${studentPage.content}">
                    <!-- STT tính chuẩn theo trang hiện tại -->
                    <td th:text="${stat.count + currentPage * studentPage.size}">1</td>
                    <td th:text="${student.id}">1</td>
                    <td>
                        <a th:href="@{/students/{id}(id=${student.id})}"
                           th:text="${student.name}"
                           class="text-decoration-none fw-semibold">Tên</a>
                    </td>
                    <td th:text="${student.email}">email</td>
                    <td th:text="${student.age}">20</td>
                    <td><span class="badge bg-secondary" th:text="${student.major}">CNTT</span></td>
                    <td>
                        <span th:classappend="${student.gpa >= 3.5} ? 'gpa-high' :
                                              (${student.gpa >= 2.5} ? 'gpa-mid' : 'gpa-low')"
                              th:text="${#numbers.formatDecimal(student.gpa, 1, 1)}">3.5</span>
                    </td>
                    <td class="text-center">
                        <a th:href="@{/students/{id}(id=${student.id})}"
                           class="btn btn-sm btn-outline-info me-1" title="Chi tiết">
                            <i class="bi bi-eye"></i>
                        </a>
                        <a th:href="@{/students/{id}/edit(id=${student.id})}"
                           class="btn btn-sm btn-outline-warning me-1" title="Sửa">
                            <i class="bi bi-pencil"></i>
                        </a>
                        <form th:action="@{/students/{id}/delete(id=${student.id})}"
                              method="post" class="d-inline"
                              th:data-name="${student.name}"
                              onsubmit="return confirm('Xóa sinh viên ' + this.dataset.name + '?')">
                            <button type="submit" class="btn btn-sm btn-outline-danger" title="Xóa">
                                <i class="bi bi-trash"></i>
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Thanh Phân Trang (Pagination) -->
    <div th:if="${totalPages > 1}" class="d-flex justify-content-between align-items-center mt-3">
        <div class="text-muted">
            <small>
                Hiển thị <strong th:text="${studentPage.numberOfElements}">0</strong> /
                <strong th:text="${totalItems}">0</strong> sinh viên
                (Trang <strong th:text="${currentPage + 1}">1</strong>/<strong th:text="${totalPages}">1</strong>)
            </small>
        </div>
        <nav>
            <ul class="pagination mb-0">
                <!-- Trang đầu -->
                <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                    <a class="page-link" th:href="@{/students(page=0, keyword=${keyword}, sortBy=${sortBy}, sortDir=${sortDir})}">&laquo;</a>
                </li>
                <!-- Trang trước -->
                <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                    <a class="page-link" th:href="@{/students(page=${currentPage - 1}, keyword=${keyword}, sortBy=${sortBy}, sortDir=${sortDir})}">Trước</a>
                </li>

                <!-- Danh sách các số trang -->
                <li class="page-item"
                    th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                    th:classappend="${i == currentPage} ? 'active'">
                    <a class="page-link"
                       th:href="@{/students(page=${i}, keyword=${keyword}, sortBy=${sortBy}, sortDir=${sortDir})}"
                       th:text="${i + 1}">1</a>
                </li>

                <!-- Trang sau -->
                <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                    <a class="page-link" th:href="@{/students(page=${currentPage + 1}, keyword=${keyword}, sortBy=${sortBy}, sortDir=${sortDir})}">Sau</a>
                </li>
                <!-- Trang cuối -->
                <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                    <a class="page-link" th:href="@{/students(page=${totalPages - 1}, keyword=${keyword}, sortBy=${sortBy}, sortDir=${sortDir})}">&raquo;</a>
                </li>
            </ul>
        </nav>
    </div>

    <!-- Tổng số sinh viên (Hiển thị khi chỉ có 1 trang) -->
    <div th:if="${totalPages <= 1 and totalItems > 0}" class="text-muted mt-2">
        <small>Tổng: <strong th:text="${totalItems}">0</strong> sinh viên</small>
    </div>

</section>
</body>
</html>
