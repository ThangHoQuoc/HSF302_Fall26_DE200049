spring.application.name=demo
server.port=8080

# T?t cache ?? s?a template không c?n restart
spring.thymeleaf.cache=false

app.bootstrap.offline=true

# ===== SQL Server =====
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=ThymeleafDemo;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123456

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# H? tr? ti?ng Vi?t cho ki?u String -> NVARCHAR
spring.jpa.properties.hibernate.use_nationalized_character_data=true
spring.jpa.open-in-view=false

# ===== i18n =====
spring.messages.basename=messages
spring.messages.encoding=UTF-8
# Không có messages_vi ? dùng messages.properties, KHÔNG r?i v? ngôn ng? c?a h? ?i?u hành
spring.messages.fallback-to-system-locale=false